# Keeps the Road to Racing section fresh: pulls the latest long-form videos & Shorts every 6 hours
# and commits data/youtube.json when anything changed. Can also be run by hand from the Actions tab.
# When YouTube's feeds are down the script keeps the last good data and the run still passes.
name: Update YouTube content

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pull latest videos
        shell: pwsh
        run: ./scripts/update-youtube.ps1

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Update YouTube content"
          # the site may have been updated while this ran: replay on top of it before pushing
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            sleep 10
          done
          exit 1
